data:
  columns:
    operation_date: booking_date
    execution_date: value_date
    description: label
    amount: amount
    account_id: account_id
  target_column: category
  date_format: "%Y-%m-%d"
  encoding: utf-8
  delimiter: ","

split:
  strategy: stratified_random
  test_size: 0.25
  random_state: 42
  group_by: null

pipelines:
  debit:
    features:
      - type: text
        params:
          column: description
          clean:
            unicode_normalization: NFKC
            lowercase: true
            strip: true
            collapse_whitespace: true
          representation:
            type: tfidf
            tfidf:
              ngram_range: [1, 2]
              max_features: 50000
              min_df: 1
      - type: amount
        params:
          column: amount
    model:
      type: lightgbm
      params:
        n_estimators: 300
        learning_rate: 0.05
        random_state: 42

  credit:
    features:
      - type: text
        params:
          column: description
          clean:
            unicode_normalization: NFKC
            lowercase: true
            strip: true
            collapse_whitespace: true
          representation:
            type: embedding
            embedding:
              provider: local
              model: sentence-transformers/all-MiniLM-L6-v2
              batch_size: 32
      - type: amount
        params:
          column: amount
    model:
      type: logistic_regression
      params:
        max_iter: 1000
        random_state: 42
