data:
  columns:
    operation_date: booking_date
    execution_date: value_date
    description: label
    amount: amount
    account_id: account_id
  target_column: category
  date_format: "%Y-%m-%d"
  encoding: utf-8
  delimiter: ","

split:
  strategy: stratified_random
  test_size: 0.25
  random_state: 42
  group_by: null

pipelines:
  debit:
    features:
      - type: text
        params:
          column: description
          clean:
            unicode_normalization: NFKC
            lowercase: true
            strip: true
            collapse_whitespace: true
          representation:
            type: tfidf
            tfidf:
              ngram_range: [1, 2]
              min_df: 1
              max_features: 10000
      - type: amount
        params:
          column: amount
    model:
      type: logistic_regression
      params:
        max_iter: 500
        random_state: 42

  credit:
    features:
      - type: text
        params:
          column: description
          clean:
            lowercase: true
          representation:
            type: tfidf
            tfidf:
              ngram_range: [1, 2]
              min_df: 1
              max_features: 10000
      - type: amount
        params:
          column: amount
    model:
      type: logistic_regression
      params:
        max_iter: 500
        random_state: 42

evaluation:
  metrics:
    - accuracy
    - balanced_accuracy
    - weighted_accuracy
    - macro_precision
    - weighted_precision
    - macro_recall
    - weighted_recall
    - macro_f1
    - weighted_f1
    - top_2_accuracy
    - log_loss
    - brier_score
    - ece
  amount_bins: [0, 20, 100, 1000]
  label_weights:
    groceries: 1.0
    rent: 2.0
    salary: 1.0
    refund: 1.5
  confidence_bins: 10
  confidence_thresholds: [0.5, 0.6, 0.7, 0.8, 0.9]
  permutation_importance:
    enabled: true
    scoring: macro_f1
    n_repeats: 5
    random_state: 42
