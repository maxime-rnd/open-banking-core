[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "open-banking-core"
version = "0.1.0"
description = "Reusable foundations for open banking transaction classification"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "lightgbm>=4.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
embeddings = ["sentence-transformers>=3.0"]
remote-embeddings = ["openai>=1.0"]
reports = ["plotly>=5.20"]

[project.scripts]
obc = "open_banking_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["open_banking_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
